name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Phase 1 (CI) - Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Check Frontend Types
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Check Backend Types
        run: |
          cd backend
          npx tsc --noEmit

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

  cd:
    name: Phase 2 (CD) - Deploy to Server
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy explicitly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 3232 }}
          script: |
            bash -lc '
              set -e
              cd /home/minhhan/auto-bell-by-minhhan.net
              
              echo "--- PULLING LATEST CODE ---"
              # Sử dụng proxy để lách chặn mạng VN
              git config --global url."https://ghproxy.net/https://github.com".insteadOf "https://github.com"
              git fetch origin main || true
              git config --global --unset url."https://ghproxy.net/https://github.com".insteadOf
              git reset --hard origin/main
              
              echo "--- BUILDING FRONTEND ---"
              cd frontend
              npm install
              npm run build
              cd ..
              
              echo "--- STOPPING BACKEND ---"
              cd backend
              npx pm2 stop autobells || true
              
              echo "--- BUILDING BACKEND ---"
              npm install --legacy-peer-deps
              npx prisma generate
              npx prisma db push --accept-data-loss
              npx tsc
              npm prune --production --legacy-peer-deps
              
              echo "--- RESTARTING BACKEND ---"
              npx pm2 restart autobells || npx pm2 start npm --name "autobells" -- run start
              
              echo "--- DEPLOYMENT SUCCESSFUL ---"
              echo "--- PM2 LOGS ---"
              npx pm2 logs autobells --lines 100 --nostream || true
            '

  notify:
    name: Discord Notification
    needs: [ci, cd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            COLOR=15158332
            TITLE="❌ Trạng thái CI/CD: Thất bại"
            STATUS_TEXT="Failed"
          else
            COLOR=3066993
            TITLE="✅ Trạng thái CI/CD: Thành công"
            STATUS_TEXT="Success"
          fi
          
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | tr -d '"\r\n\\')
          DESC="Dự án: **${{ github.repository }}**\nKết quả: **$STATUS_TEXT**\nNội dung: **${COMMIT_MSG}**\nThực hiện bởi: **${{ github.actor }}**"
          USERNAME="${{ github.repository }} (CI/CD)"
          
          curl -H "Content-Type: application/json" \
            -d "{\"username\": \"$USERNAME\", \"embeds\": [{\"title\": \"$TITLE\", \"description\": \"$DESC\", \"color\": $COLOR}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}