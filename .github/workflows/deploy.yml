name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into server and deploy explicitly
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 3232 }}
          script: |
            # Use a login shell to ensure all PATHs (npm, pm2, nvm) are loaded exactly like a manual login
            bash -lc '
              set -e
              cd /home/minhhan/auto-bell-by-minhhan.net
              
              echo "--- PULLING LATEST CODE ---"
              git fetch origin main
              git reset --hard origin/main
              
              echo "--- BUILDING FRONTEND ---"
              cd frontend
              npm install
              npm run build
              cd ..
              
              echo "--- STOPPING BACKEND ---"
              cd backend
              npx pm2 stop autobells || true
              
              echo "--- BUILDING BACKEND ---"
              npm install
              npx prisma generate
              npx prisma db push --accept-data-loss
              npx tsc
              
              echo "--- RESTARTING BACKEND ---"
              npx pm2 restart autobells || npx pm2 start npm --name "autobells" -- run start
              
              echo "--- DEPLOYMENT SUCCESSFUL ---"
            '

      - name: Discord Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Trạng thái Deploy"
          else
            COLOR=15158332
            TITLE="❌ Trạng thái Deploy"
          fi
          
          # Lấy dòng đầu tiên của commit message
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | tr -d '"\r\n\\')
          
          DESC="Dự án: **${{ github.repository }}**\nKết quả: **${{ job.status }}**\nNội dung: **${COMMIT_MSG}**\nThực hiện bởi: **${{ github.actor }}**"
          USERNAME="${{ github.repository }} (CI/CD)"
          
          curl -H "Content-Type: application/json" \
            -d "{\"username\": \"$USERNAME\", \"embeds\": [{\"title\": \"$TITLE\", \"description\": \"$DESC\", \"color\": $COLOR}]}" \
            https://discordapp.com/api/webhooks/1546123810598551652/jFaAxDkyq4cqywUtiw8MJnK_QUt_TBzUjPVc9BpaNvdxMjY4IB0u9v9UVxuam7DYqkKu